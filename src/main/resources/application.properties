# ==========================
# APPLICATION SETTINGS
# ==========================
spring.application.name=gymflow
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================
# SWAGGER & API DOCS
# ==========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

# ==========================
# JACKSON CONFIG (JSON SERIALIZATION)
# ==========================
spring.jackson.serialization.fail-on-empty-beans=false

# ? Force Jackson to format Java 8 date types using Kolkata timezone
spring.jackson.time-zone=Asia/Kolkata

# ? Prevent Jackson from converting Instant types directly back to UTC "Z" strings
spring.jackson.serialization.write-dates-with-zone-id=true
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# ==========================
# SCHEDULER SETTINGS
# ==========================
# Run every day at 2 AM
scheduler.expiry-reminder.cron=0 0 2 * * ?

# ==========================
# DATABASE TIMEZONE CONFIG
# ==========================
# Force Hibernate to handle database timezone translations using IST
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata